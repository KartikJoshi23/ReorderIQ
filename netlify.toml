# Netlify configuration for the ReorderIQ dashboard (static site; no server functions).

[build]
  base = "app"            # the Vite project lives in app/
  command = "npm run build"
  publish = "dist"        # relative to base → app/dist

[build.environment]
  NODE_VERSION = "22"

# Cross-origin isolation enables SharedArrayBuffer → multi-threaded TensorFlow.js WebAssembly.
# Every asset is same-origin (fonts are self-hosted), so require-corp is safe.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change → cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# A missing build asset or data file must be a real 404, never the HTML shell: after a redeploy an
# old page asking for an old chunk would otherwise receive HTML as JavaScript (cached immutably).
# Existing files are served first, so these rules only apply to missing ones.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

# Single-page app (hash routing); any other path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
